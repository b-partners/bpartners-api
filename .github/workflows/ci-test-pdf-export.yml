name: ExportAreaPictureAnnotationPdfVisualTest

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # 1. Discover all test methods in ExportAreaPictureAnnotationPdfVisualTest
  discover-tests:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract test methods
        id: set-matrix
        run: |
          set -euo pipefail
          TEST_FILE="src/test/java/app/bpartners/api/unit/service/ExportAreaPictureAnnotationPdfVisualTest.java"
          # Take the first "void <name>(" that follows each @Test,
          # so annotations such as @Disabled in between are skipped.
          METHODS=$(awk '
            /@Test/ { found = 1; next }
            found && match($0, /void[ \t]+([A-Za-z0-9_]+)[ \t]*\(/, m) { print m[1]; found = 0 }
          ' "$TEST_FILE" | sort -u | jq -R . | jq -s -c .)
          echo "Discovered test methods: $METHODS"
          echo "matrix=$METHODS" >> "$GITHUB_OUTPUT"

  # 2. Run each test method independently and upload its generated PDF artifact
  run-visual-tests:
    needs: discover-tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        test-method: ${{ fromJson(needs.discover-tests.outputs.matrix) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Grant execute permission for Gradle wrapper
        run: chmod +x gradlew

      - name: Run Test Method (Ignoring @Disabled, skipping JaCoCo gate)
        run: |
          ./gradlew test \
            --tests "app.bpartners.api.unit.service.ExportAreaPictureAnnotationPdfVisualTest.${{ matrix.test-method }}" \
            -Djunit.jupiter.conditions.deactivate=org.junit.jupiter.api.Disabled \
            -x jacocoTestReport \
            -x jacocoTestCoverageVerification

      - name: Upload PDF Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pdf-${{ matrix.test-method }}
          path: build/annotation-export-*.pdf
          if-no-files-found: warn
          retention-days: 28