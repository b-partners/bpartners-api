name: Heavy Payload Dynamic Matrix

on:
  pull_request:
    branches-ignore:
      - preprod
      - prod
      - main

jobs:
  discover-tests:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Extract Target Test Methods
        id: set-matrix
        run: |
          TEST_FILE="src/test/java/app/bpartners/api/unit/service/ExportAreaPictureAnnotationPdfVisualTest.java"
          
          # Extract method names starting with generate_from_heavy_payload
          METHODS=$(grep -oE 'void generate_from_heavy_payload[a-zA-Z0-9_]*' "$TEST_FILE" | awk '{print $2}')
          
          # Convert newline separated list into a compact JSON array string
          JSON_ARRAY=$(echo "$METHODS" | jq -R . | jq -s -c .)
          
          echo "Discovered test methods: $JSON_ARRAY"
          echo "matrix=$JSON_ARRAY" >> $GITHUB_OUTPUT

  run-heavy-tests:
    needs: discover-tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        test-method: ${{ fromJson(needs.discover-tests.outputs.matrix) }}

    name: Target ➔ ${{ matrix.test-method }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Run Individual Discovered Test
        run: |
          ./gradlew test --tests "app.bpartners.api.unit.service.ExportAreaPictureAnnotationPdfVisualTest.${{ matrix.test-method }}"

      - name: Archive Generated Visual PDF Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pdf-${{ matrix.test-method }}
          path: build/annotation-export-*.pdf
          if-no-files-found: ignore