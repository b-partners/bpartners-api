name: Heavy Payload PDF Test

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  heavy-payload-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'corretto'
          cache: gradle

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Run heavy payload PDF test
        run: |
          ./gradlew test \
            --tests "ExportAreaPictureAnnotationPdfVisualTest.generate_from_heavy_payload" \
            -i
        continue-on-error: true

      - name: List generated PDFs
        if: always()
        run: find build -name "*.pdf" -type f

      - name: Upload generated PDFs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: heavy-payload-test-pdfs
          path: build/**/*.pdf
          retention-days: 30
          if-no-files-found: warn

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: build/test-results/
          retention-days: 30
          if-no-files-found: warn

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: build/reports/tests/
          retention-days: 30
          if-no-files-found: warn