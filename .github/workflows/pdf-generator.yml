name: ExportAreaPictureAnnotationPdfVisualTest

on:
  pull_request:

jobs:
  # 1. Discover all test methods in ExportAreaPictureAnnotationPdfVisualTest
  discover-tests:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract test methods
        id: set-matrix
        run: |
          TEST_FILE="src/test/java/app/bpartners/api/unit/service/ExportAreaPictureAnnotationPdfVisualTest.java"

          # Use sed/grep to match method name directly following @Test
          METHODS=$(grep -A 1 '@Test' "$TEST_FILE" | grep -v '@Test' | grep -v '^--' | sed -E 's/.*void ([a-zA-Z0-9_]+).*/\1/' | jq -R . | jq -s -c .)

          echo "Discovered test methods: $METHODS"
          echo "matrix=$METHODS" >> $GITHUB_OUTPUT

  # 2. Run each test method independently and upload its generated PDF artifact
  run-visual-tests:
    needs: discover-tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        test-method: ${{ fromJson(needs.discover-tests.outputs.matrix) }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Grant execute permission for Gradle wrapper
        run: chmod +x gradlew

      - name: Run Test Method (Ignoring @Disabled)
        run: |
          ./gradlew test \
            --tests "app.bpartners.api.unit.service.ExportAreaPictureAnnotationPdfVisualTest.${{ matrix.test-method }}" \
            -Djunit.jupiter.conditions.deactivate=org.junit.jupiter.api.Disabled

      - name: Upload PDF Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pdf-${{ matrix.test-method }}
          path: build/annotation-export-*.pdf
          retention-days: 7