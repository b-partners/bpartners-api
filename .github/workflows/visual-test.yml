name: Visual Test - Export Area Picture Annotation PDF

on:
  push:
    branches:
      - '*'
      - '!preprod'
      - '!prod'
  pull_request:
  workflow_dispatch:

env:
  STRIPE_PRIVATE_API_KEY: ${{ secrets.STRIPE_PRIVATE_API_KEY }}
  GOOGLE_GEOCODE_API_KEY: ${{ secrets.GOOGLE_GEOCODE_API_KEY }}
  GEODATA_IMAGERY_BASEURL: ${{secrets.GEODATA_IMAGERY_BASEURL}}

jobs:
  visual-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4.1.6

      - name: Enable visual tests by removing @Disabled annotation
        run: |
          sed -i 's/@Disabled("This is a visual test to generate a PDF file for manual inspection.")//g' src/test/java/app/bpartners/api/unit/service/ExportAreaPictureAnnotationPdfVisualTest.java
          echo "Removed @Disabled annotation to enable visual tests"

      - name: Cache Gradle dependencies
        uses: actions/cache@v3
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - uses: actions/setup-java@v4.2.1
        with:
          java-version: '21'
          distribution: 'corretto'

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Run visual tests with specific test filtering
        # Run only the visual tests, disabling coverage collection to avoid failures
        # We use --tests to specify exactly which test class/methods to run
        run: |
          ./gradlew test \
            --tests "app.bpartners.api.unit.service.ExportAreaPictureAnnotationPdfVisualTest.*" \
            --no-daemon \
            --info \
            --continue  # Continue running tests even if some fail

      - name: Check test results
        # This step will fail if any tests actually failed
        # We look for test failure files and fail the job if any exist
        run: |
          if [ -d "build/test-results/test" ]; then
            FAILED_TESTS=$(find build/test-results/test -name "*.xml" -exec grep -l "<failure" {} \; | wc -l)
            if [ $FAILED_TESTS -gt 0 ]; then
              echo "Found $FAILED_TESTS failed test(s)"
              exit 1
            else
              echo "No test failures found"
            fi
          else
            echo "Test results directory not found - assuming tests ran successfully"
          fi

      - name: Upload generated PDFs as artifacts
        if: always()  # Always run this step to capture generated PDFs
        uses: actions/upload-artifact@v4
        with:
          name: generated-visual-pdfs
          path: build/annotation-export-*.pdf
          retention-days: 30
