AWSTemplateFormatVersion: 2010-09-09
Description: Bpartners - Schedulers

Parameters:
  Env:
    Type: String
Conditions:
  IsProd: !Equals [!Ref Env, "prod"]

Resources:
  ScheduledEventExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Join [ '', [ bpartners-, !Ref Env, -ScheduledEventExecutionRole ] ]
      AssumeRolePolicyDocument:
        Statement:
          - Effect: Allow
            Principal:
              Service: scheduler.amazonaws.com
            Action: 'sts:AssumeRole'
      ManagedPolicyArns:
        - 'arn:aws:iam::aws:policy/AdministratorAccess'

  RefreshInvoiceSummaryScheduler:
    Type: AWS::Scheduler::Schedule
    Properties:
      Description: Scheduler that trigger the refresh of invoices summaries
      FlexibleTimeWindow:
        Mode: "OFF"
      Name: !Join ['', [!Ref Env, -RefreshInvoiceSummary]]
      ScheduleExpression: "cron(0 8,12,16 * * ? *)"
      Target:
        Arn: !Sub '{{resolve:ssm:/bpartners/${Env}/eventbridge/bus-arn}}'
        RoleArn: !GetAtt ScheduledEventExecutionRole.Arn
        DeadLetterConfig:
          Arn: !Sub '{{resolve:ssm:/bpartners/${Env}/1/sqs/dead-letter-queue-arn}}'
        EventBridgeParameters:
          DetailType: 'app.bpartners.api.endpoint.event.model.RefreshInvoiceSummaryTriggered'
          Source: 'app.bpartners.api.event1'
  MonthlyCancelledClientsPaymentScheduler:
    Type: AWS::Scheduler::Schedule
    Properties:
      Description: Scheduler that triggers the computing of monthly subscription invoices 
        for users whom cancelled during setup mode
      FlexibleTimeWindow:
        Mode: "OFF"
      Name: !Join [ '', [ !Ref Env, -TriggerMonthlyCancelledClientsPayment ] ]
      ScheduleExpression: "cron(0 8 5 *  ? *)"
      ScheduleExpressionTimezone: "Europe/Paris"
      Target:
        Arn: !Sub '{{resolve:ssm:/bpartners/${Env}/eventbridge/bus-arn}}'
        RoleArn: !GetAtt ScheduledEventExecutionRole.Arn
        DeadLetterConfig:
          Arn: !Sub '{{resolve:ssm:/bpartners/${Env}/1/sqs/dead-letter-queue-arn}}'
        EventBridgeParameters:
          DetailType: 'app.bpartners.api.endpoint.event.model.MonthlyCancelledClientsPayment'
          Source: 'app.bpartners.api.event1'
  MonthlySubscriptionCreditGrantTriggeredScheduler:
    Type: AWS::Scheduler::Schedule
    Properties:
      Description: Scheduler that trigger the granting of the credits included in the subscription
        plans, at the start of every billing period
      FlexibleTimeWindow:
        Mode: "OFF"
      Name: !Join ['', [!Ref Env, -TriggerMonthlySubscriptionCreditGrant]]
      ScheduleExpression: "cron(15 0 1 * ? *)"
      ScheduleExpressionTimezone: "Europe/Paris"
      Target:
        Arn: !Sub '{{resolve:ssm:/bpartners/${Env}/eventbridge/bus-arn}}'
        RoleArn: !GetAtt ScheduledEventExecutionRole.Arn
        DeadLetterConfig:
          Arn: !Sub '{{resolve:ssm:/bpartners/${Env}/2/sqs/dead-letter-queue-arn}}'
        EventBridgeParameters:
          DetailType: 'app.bpartners.api.endpoint.event.model.MonthlySubscriptionCreditGrantTriggered'
          Source: 'app.bpartners.api.event2'
  RelaunchProspectsScheduler:
    Type: AWS::Scheduler::Schedule
    Properties:
      Description: Scheduler that trigger the relaunch of prospects
      FlexibleTimeWindow:
        Mode: "OFF"
      Name: !Join ['', [!Ref Env, -RelaunchProspects]]
      ScheduleExpression: "cron(0 14 ? * FRI *)"
      ScheduleExpressionTimezone: "Europe/Paris"
      Target:
        Arn: !Sub '{{resolve:ssm:/bpartners/${Env}/eventbridge/bus-arn}}'
        RoleArn: !GetAtt ScheduledEventExecutionRole.Arn
        DeadLetterConfig:
          Arn: !Sub '{{resolve:ssm:/bpartners/${Env}/1/sqs/dead-letter-queue-arn}}'
        EventBridgeParameters:
          DetailType: 'app.bpartners.api.endpoint.event.model.RelaunchHoldersProspectTriggered'
          Source: 'app.bpartners.api.event1'
