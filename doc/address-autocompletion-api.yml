operations:
  autoCompleteAddress:
    post:
      tags:
        - Address Autocompletion
      summary: Provide autocompletion when user types address
      operationId: autoCompleteAddress
      parameters:
        - in : query
          name : address
          schema:
            type: string
          required: true
        - in: query
          name: sessionId
          schema:
            type: string
          required: true
      responses:
        200:
          description: List of suggesting address
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AutoCompletePrediction"
        400:
          $ref: './api.yml#/components/responses/400'
        403:
          $ref: './api.yml#/components/responses/403'
        404:
          $ref: './api.yml#/components/responses/404'
        429:
          $ref: './api.yml#/components/responses/429'
        500:
          $ref: './api.yml#/components/responses/500'
components:
  schemas:
    AutoCompletePrediction:
      type: object
      properties:
        placeId:
          type: string
          example: 'bdd4a9f4-8572-48ac-8b92-c6598d677007'
        description:
          type: string
          example: '2 Quai des Pêcheurs, 67500 Haguenau, France'
        distance:
          type: integer
          example: '20 meters'