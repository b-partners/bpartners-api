operations:
  areaPictureMapLayerOperations:
    get:
      tags:
        - AreaPicture
      summary: Retrieve area picture map layers for specific longitude and latitude.
      description: |
        Layers retrieved are ordered by priority layer, default and worst image quality providers being IGN.
      operationId: getAreaPictureMapLayers
      parameters:
        - in: query
          name: longitude
          schema:
            type: number
          required: true
        - in: query
          name: latitude
          schema:
            type: number
          required: true
      responses:
        200:
          description: List of area picture map layers according to specific longitude and latitude
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AreaPictureMapLayer"
  getAllAreaPictures:
    get:
      tags:
        - AreaPicture
      summary: |
        list all existing area pictures linked to this account
      operationId: getAllAreaPictures
      parameters:
        - in: query
          name: page
          schema:
            $ref: './api.yml#/components/schemas/Page'
        - in: query
          name: pageSize
          schema:
            $ref: './api.yml#/components/schemas/PageSize'
        - in: path
          name: aId
          schema:
            type: string
          required: true
        - in: query
          name: address
          schema:
            type: string
        - in: query
          name: filename
          schema:
            type: string
      responses:
        200:
          description: area pictures
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AreaPictureDetails"
        400:
          $ref: './api.yml#/components/responses/400'
        403:
          $ref: './api.yml#/components/responses/403'
        404:
          $ref: './api.yml#/components/responses/404'
        429:
          $ref: './api.yml#/components/responses/429'
        500:
          $ref: './api.yml#/components/responses/500'
  AreaPictureSingleOperations:
    put:
      tags:
        - Files
        - AreaPicture
      summary: |
        Download a file from external image source if it doesn't exist yet, and saves it in S3.
        Otherwise, download from S3
      operationId: crupdateAreaPictureDetails
      parameters:
        - in: path
          name: aId
          schema:
            type: string
          required: true
        - in: path
          name: id
          schema:
            type: string
          required: true
      requestBody:
        required: true
        description:
          |
          an address readable by BAN API 
          to convert into geographical coordinates in order to get a specific area
          as a picture
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CrupdateAreaPictureDetails"
      responses:
        200:
          description: The file
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AreaPictureDetails'
        400:
          $ref: './api.yml#/components/responses/400'
        403:
          $ref: './api.yml#/components/responses/403'
        404:
          $ref: './api.yml#/components/responses/404'
        429:
          $ref: './api.yml#/components/responses/429'
        500:
          $ref: './api.yml#/components/responses/500'
        501:
          description: Address or zone not yet supported
          content:
            application/json:
              schema:
                $ref: './api.yml#/components/schemas/NotImplementedException'
                example:
                  type: NotImplementedException
                  example: Address or zone <address/zone> not yet supported
        503:
          description: Address or zone temporarily unavailable
          content:
            application/json:
              schema:
                $ref: './api.yml#/components/schemas/ServiceUnavailableException'
                example:
                  type: ServiceUnavailableException
                  message: Address or zone <address/zone> temporarily unavailable
    get:
      tags:
        - Files
        - AreaPicture
      summary: get specified area picture
      operationId: getAreaPictureById
      parameters:
        - in: path
          name: aId
          schema:
            type: string
          required: true
        - in: path
          name: id
          schema:
            type: string
          required: true
      responses:
        200:
          description: The Area Picture Details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AreaPictureDetails"
        400:
          $ref: './api.yml#/components/responses/400'
        403:
          $ref: './api.yml#/components/responses/403'
        404:
          $ref: './api.yml#/components/responses/404'
        429:
          $ref: './api.yml#/components/responses/429'
        500:
          $ref: './api.yml#/components/responses/500'
  areaPictureAnnotationListOperations:
    get:
      tags:
        - AreaPicture
      summary: get area picture annotations
      operationId: getAreaPictureAnnotations
      parameters:
        - in: path
          name: aId
          schema:
            type: string
          required: true
        - in: path
          name: areaPictureId
          schema:
            type: string
          required: true
        - in: query
          name: page
          schema:
            $ref: './api.yml#/components/schemas/Page'
        - in: query
          name: pageSize
          schema:
            $ref: './api.yml#/components/schemas/PageSize'
      responses:
        200:
          description: annotations made on the area picture, ordered by creation date-time
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AreaPictureAnnotation"
        400:
          $ref: './api.yml#/components/responses/400'
        403:
          $ref: './api.yml#/components/responses/403'
        404:
          $ref: './api.yml#/components/responses/404'
        429:
          $ref: './api.yml#/components/responses/429'
        500:
          $ref: './api.yml#/components/responses/500'
  areaPictureAnnotationSingleOperation:
    get:
      tags:
        - AreaPicture
      summary: get area picture annotations
      operationId: getAreaPictureAnnotation
      parameters:
        - in: path
          name: aId
          schema:
            type: string
          required: true
        - in: path
          name: areaPictureId
          schema:
            type: string
          required: true
        - in: path
          name: annotationId
          schema:
            type: string
          required: true
      responses:
        200:
          description:
            the requested annotation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AreaPictureAnnotation"
        400:
          $ref: './api.yml#/components/responses/400'
        403:
          $ref: './api.yml#/components/responses/403'
        404:
          $ref: './api.yml#/components/responses/404'
        429:
          $ref: './api.yml#/components/responses/429'
        500:
          $ref: './api.yml#/components/responses/500'
    put:
      tags:
        - AreaPicture
      summary: get area picture annotations
      operationId: annotateAreaPicture
      parameters:
        - in: path
          name: aId
          schema:
            type: string
          required: true
        - in: path
          name: areaPictureId
          schema:
            type: string
          required: true
        - in: path
          name: annotationId
          schema:
            type: string
          required: true
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AreaPictureAnnotation"
      responses:
        200:
          description: the created annotation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AreaPictureAnnotation"
        400:
          $ref: './api.yml#/components/responses/400'
        403:
          $ref: './api.yml#/components/responses/403'
        404:
          $ref: './api.yml#/components/responses/404'
        429:
          $ref: './api.yml#/components/responses/429'
        500:
          $ref: './api.yml#/components/responses/500'
  draftAreaPictureAnnotationListOperationsByAccountId:
    get:
      tags:
        - AreaPicture
      summary: get draft area picture annotations by accountId
      operationId: getDraftAnnotationsByAccountId
      parameters:
        - in: path
          name: aId
          schema:
            type: string
          required: true
        - in: query
          name: page
          schema:
            $ref: './api.yml#/components/schemas/Page'
        - in: query
          name: pageSize
          schema:
            $ref: './api.yml#/components/schemas/PageSize'
      responses:
        200:
          description: all draft annotations made for the given account, ordered by creation date-time
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DraftAreaPictureAnnotation"
        400:
          $ref: './api.yml#/components/responses/400'
        403:
          $ref: './api.yml#/components/responses/403'
        404:
          $ref: './api.yml#/components/responses/404'
        429:
          $ref: './api.yml#/components/responses/429'
        500:
          $ref: './api.yml#/components/responses/500'
  draftAreaPictureAnnotationListOperationsByAccountIdAndAreaPictureId:
    get:
      tags:
        - AreaPicture
      summary: get draft area picture annotations by accountId and areaPictureId
      operationId: getDraftAnnotationsByAccountIdAndAreaPictureId
      parameters:
        - in: path
          name: aId
          schema:
            type: string
          required: true
        - in: path
          name: areaPictureId
          schema:
            type: string
          required: true
        - in: query
          name: page
          schema:
            $ref: './api.yml#/components/schemas/Page'
        - in: query
          name: pageSize
          schema:
            $ref: './api.yml#/components/schemas/PageSize'
      responses:
        200:
          description: draft annotations made on the area picture, ordered by creation date-time
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DraftAreaPictureAnnotation"
        400:
          $ref: './api.yml#/components/responses/400'
        403:
          $ref: './api.yml#/components/responses/403'
        404:
          $ref: './api.yml#/components/responses/404'
        429:
          $ref: './api.yml#/components/responses/429'
        500:
          $ref: './api.yml#/components/responses/500'
  convertLatLonPolygonToPixel:
    post:
      tags:
        - AreaPicture
      summary: convert annotations coordinate to pixel
      operationId: convertAreaPictureAnnotationsToPixel
      parameters:
        - in: path
          name: aId
          schema:
            type: string
          required: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConverterData'
      responses:
        200:
          description: Converted annotations
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConverterData'
        400:
          $ref: './api.yml#/components/responses/400'
        403:
          $ref: './api.yml#/components/responses/403'
        404:
          $ref: './api.yml#/components/responses/404'
        429:
          $ref: './api.yml#/components/responses/429'
        500:
          $ref: './api.yml#/components/responses/500'
  exportAreaPictureAnnotations:
    post:
      tags:
        - AreaPicture
      summary: Export Area Picture Annotation with information to PDF
      operationId: exportAreaPictureAnnotationToPdf
      parameters:
        - in: path
          name: aId
          schema:
            type: string
          required: true
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                globalImage3D:
                  type: string
                  format: binary
                data:
                  $ref: '#/components/schemas/ExportAreaPictureAnnotation'
      responses:
        200:
          description: Presigned url to the generated pdf
          content:
            application/json:
              schema:
                $ref: './api.yml#/components/schemas/PreSignedURL'
        400:
          $ref: './api.yml#/components/responses/400'
        403:
          $ref: './api.yml#/components/responses/403'
        404:
          $ref: './api.yml#/components/responses/404'
        429:
          $ref: './api.yml#/components/responses/429'
        500:
          $ref: './api.yml#/components/responses/500'
components:
  schemas:
    Zoom:
      type: object
      properties:
        level:
          $ref: "#/components/schemas/ZoomLevel"
        number:
          type: integer
    ZoomLevel:
      type: string
      enum:
        - WORLD_0
        - WORLD_1
        - WORLD_2
        - CONTINENT_0
        - CONTINENT_1
        - COUNTRIES
        - COUNTRY
        - STATES
        - COUNTIES_0
        - COUNTIES_1
        - COUNTY
        - METROPOLITAN_AREA
        - CITIES
        - CITY
        - TOWN
        - NEIGHBORHOOD
        - STREETS
        - CITY_BLOCK
        - BUILDINGS
        - BUILDING
        - HOUSES_0
        - HOUSES_1
        - HOUSES_2
        - HOUSE_PROPERTY
    AreaPictureImageSource:
      type: string
      enum:
        - OPENSTREETMAP
        - GEOSERVER
        - GEOSERVER_IGN
    AreaPictureMapLayer:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        year:
          type: int
        source:
          $ref: "#/components/schemas/AreaPictureImageSource"
        departementName:
          type: string
        maximumZoomLevel:
          $ref: "#/components/schemas/ZoomLevel"
        maximumZoom:
          $ref: "#/components/schemas/Zoom"
        precisionLevelInCm:
          type: int
    OpenStreetMapLayer:
      deprecated: true
      description: deprecated, use AreaMapLayer
      type: string
      enum:
        - tous_fr
    AreaPictureDetailsTemplate:
      type: object
      properties:
        address:
          type: string
        zoomLevel:
          $ref: "#/components/schemas/ZoomLevel"
        zoom:
          $ref: "#/components/schemas/Zoom"
        fileId:
          type: string
        filename:
          type: string
        prospectId:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        layer:
          $ref: "#/components/schemas/OpenStreetMapLayer"
        isExtended:
          type: boolean
        shiftNb:
          type: integer
        isOpaque:
          type: boolean

    CrupdateAreaPictureDetails:
      type: object
      allOf:
        - $ref: "#/components/schemas/AreaPictureDetailsTemplate"
      properties:
        layerId:
          type: string

    AreaPictureDetails:
      allOf:
        - $ref: "#/components/schemas/AreaPictureDetailsTemplate"
      properties:
        id:
          type: string
        xTile:
          type: integer
        yTile:
          type: integer
        xOffset:
          type: integer
        yOffset:
          type: integer
        currentTile:
          $ref: "#/components/schemas/Tile"
        referenceTile:
          $ref: "#/components/schemas/Tile"
        currentGeoPosition:
          $ref: "#/components/schemas/GeoPosition"
        availableLayers:
          type: array
          deprecated: true
          description: use otherLayers instead
          items:
            $ref: "#/components/schemas/OpenStreetMapLayer"
        actualLayer:
          $ref: "#/components/schemas/AreaPictureMapLayer"
        otherLayers:
          type: array
          items:
            $ref: "#/components/schemas/AreaPictureMapLayer"
        geoPositions:
          type: array
          items:
            $ref: "#/components/schemas/GeoPosition"
    Tile:
      type: object
      properties:
        x:
          type: integer
        y:
          type: integer
        zoom:
          $ref: "#/components/schemas/Zoom"
    GeoPosition:
      type: object
      properties:
        score:
          type: number
          format: double
        longitude:
          type: number
          format: double
        latitude:
          type: number
          format: double
    Point:
      type: object
      properties:
        x:
          type: number
          format: double
        y:
          type: number
          format: double
    Polygon:
      type: object
      properties:
        points:
          type: array
          items:
            $ref: '#/components/schemas/Point'
    AreaPictureAnnotationInstance:
      type: object
      properties:
        id:
          type: string
        areaPictureId:
          type: string
        annotationId:
          type: string
        metadata:
          $ref: '#/components/schemas/AreaPictureAnnotationInstanceMetadata'
        userId:
          type: string
        labelType:
          type: string
        labelName:
          type: string
        polygon:
          $ref: '#/components/schemas/Polygon'
    AreaPictureAnnotationInstanceMetadata:
      type: object
      properties:
        area:
          type: number
          format: double
        slope:
          type: number
          format: double
        covering:
          type: string
        comment:
          type: string
        fillColor:
          type: string
        strokeColor:
          type: string
        obstacle:
          type: string
        wearLevel:
          type: number
          format: double
        wearness:
          $ref: "#/components/schemas/Wearness"
        moldRate:
          type: number
          format: double
        humidityLevel:
          type: number
          format: double
        height:
          type: number
          format: double
        revetement1:
          type: string
        revetement2:
          type: string
    Wearness:
      type: string
      enum:
        - LOW
        - PARTIAL
        - ADVANCED
        - EXTREME
    AreaPictureAnnotation:
      type: object
      properties:
        id:
          type: string
        idAreaPicture:
          type: string
        creationDatetime:
          description: ignored in requestBody for creation
          type: string
          format: date-time
        isDraft:
          type: boolean
        annotations:
          type: array
          items:
            $ref: "#/components/schemas/AreaPictureAnnotationInstance"
        properties:
          type: object
          additionalProperties: true
    DraftAreaPictureAnnotation:
      type: object
      allOf:
        - $ref: "#/components/schemas/AreaPictureAnnotation"
      properties:
        areaPicture:
          $ref: "#/components/schemas/AreaPictureDetails"
    ExportAreaPictureAnnotationMeasurement:
      type: object
      properties:
        unit:
          type: string
        value:
          type: number
          format: double
        isInvisible:
          type: boolean
      required:
        - unit
        - value
        - isInvisible
    ExportAreaPictureAnnotationInstanceInfo:
      type: object
      properties:
        label:
          type: string
        value:
          type: string
      required:
        - label
        - value
    ExportAreaPictureAnnotationInstance:
      type: object
      properties:
        measurements:
          type: array
          items:
            $ref: "#/components/schemas/ExportAreaPictureAnnotationMeasurement"
        infos:
          type: array
          items:
            $ref: "#/components/schemas/ExportAreaPictureAnnotationInstanceInfo"
        polygon:
          $ref: "#/components/schemas/Polygon"
        fillColor:
          type: string
        strokeColor:
          type: string
        labelName:
          type: string
      required:
        - infos
        - polygon
        - fillColor
        - strokeColor
        - measurements
    ExportAreaPictureAnnotation:
      type: object
      properties:
        address:
          type: string
        imageUrl:
          type: string
        globalRateValue:
          type: number
          format: double
        globalRateType:
          type: string
        llm:
          type: string
        3d:
          $ref: "#/components/schemas/ExportAreaPictureAnnotation3D"
        annotations:
          type: array
          items:
            $ref: "#/components/schemas/ExportAreaPictureAnnotationInstance"
      required:
        - address
        - imageUrl
        - annotations
    ExportAreaPictureAnnotation3D:
      type: object
      properties:
        pans:
          type: array
          items:
            $ref: "#/components/schemas/ExportAreaPictureAnnotation3DPan"
      required:
        - pans
    ExportAreaPictureAnnotation3DPan:
      type: object
      properties:
        name:
          type: string
        polygon:
          $ref: "#/components/schemas/Polygon"
        measurements:
          type: array
          items:
            $ref: "#/components/schemas/ExportAreaPictureAnnotationMeasurement"
        infos:
          type: array
          items:
            $ref: "#/components/schemas/ExportAreaPictureAnnotationInstanceInfo"
      required:
        - name
        - polygon
        - measurements
        - infos
    ConverterData:
      type: object
      additionalProperties:
        $ref: '#/components/schemas/ConverterAnnotation'
    ConverterAnnotation:
      type: object
      properties:
        size:
          type: integer
          example: 1024
        filename:
          type: string
          example: "4f0df528c51644f8a5050f1e3a4ee2b8_20_523561_370292.jpg"
        zoom:
          type: integer
          example: 20
        regions:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/ConverterAnnotationRegion'
        base64_img_data:
          type: string
      required:
        - size
        - filename
        - zoom
        - regions
    ConverterAnnotationRegion:
      properties:
        shape_attributes:
          $ref: '#/components/schemas/ConverterAnnotationShapeAttributes'
        region_attributes:
          $ref: '#/components/schemas/ConverterAnnotationShapeAttributes'
      required:
        - shape_attributes
        - region_attributes
    ConverterAnnotationShapeAttributes:
      type: object
      properties:
        name:
          type: string
          example: "polygon"
        all_points_x:
          type: array
          items:
            type: number
        all_points_y:
          type: array
          items:
            type: number
      required:
        - all_points_x
        - all_points_y
    ConverterRegionAttributes:
      type: object
      properties:
        label:
          type: string
        confidence:
          type: number