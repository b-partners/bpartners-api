operations:
  detectionTrackingOperations:
    get:
      tags:
        - Detection Tracking
      summary: Retrieve detection tracking list of specific user
      parameters:
        - in: path
          name: userId
          schema:
            type: string
          required: true
        - in: query
          name: search
          description: |
            Filter detection tracking by zone or address or initiator details or both.
          schema:
            type: string
          required: false
        - in: query
          name: page
          schema:
            $ref: './api.yml#/components/schemas/Page'
        - in: query
          name: pageSize
          schema:
            $ref: './api.yml#/components/schemas/PageSize'
      operationId: retrieveDetectionTrackingListByUserId
      responses:
        200:
          description: List of registered detection tracking ordered by creation datetime DESC
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DetectionTracking"
        400:
          $ref: './api.yml#/components/responses/400'
        402:
          $ref: './api.yml#/components/responses/402'
        403:
          $ref: './api.yml#/components/responses/403'
        404:
          $ref: './api.yml#/components/responses/404'
        429:
          $ref: './api.yml#/components/responses/429'
        500:
          $ref: './api.yml#/components/responses/500'
    post:
      tags:
        - Detection Tracking
      summary: Register detection for tracking
      description: |
        Each registered detection debits `SubscriptionPlan.creditCostPerAnalysis` credits from the
        user wallet and appends a `CONSUMPTION` credit transaction. Nothing is registered when the
        wallet cannot cover the whole batch.
      parameters:
        - in: path
          name: userId
          schema:
            type: string
          required: true
      operationId: registerDetection
      requestBody:
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/CreateDetectionTracking'
        required: true
      responses:
        200:
          description: List of registered detection tracking
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DetectionTracking"
        400:
          $ref: './api.yml#/components/responses/400'
        402:
          $ref: './api.yml#/components/responses/402'
        403:
          $ref: './api.yml#/components/responses/403'
        404:
          $ref: './api.yml#/components/responses/404'
        429:
          $ref: './api.yml#/components/responses/429'
        500:
          $ref: './api.yml#/components/responses/500'
components:
  schemas:
    DetectionTracking:
      allOf:
        - $ref: '#/components/schemas/CreateDetectionTracking'
      properties:
        id:
          type: string
    CreateDetectionTracking:
      type: object
      properties:
        detectionIdentifier:
          type: string
          description: Refers to detection end-to-end identifier
        zone:
          type: string
        address:
          type: string
        initiator:
          $ref: '#/components/schemas/DetectionInitiator'
        creationDatetime:
          type: string
          format: date-time
    DetectionInitiator:
      type: object
      properties:
        name:
          type: string
        email:
          type: string
        phoneNumber:
          type: string