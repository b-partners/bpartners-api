operations:
  ping:
    get:
      tags:
        - Security
      summary: pong
      operationId: ping
      security: [ ]
      description: Check server health
      responses:
        200:
          description: pong
          content:
            text/plain:
              schema:
                type: string
                example: pong
        500:
          $ref: './api.yml#/components/responses/500'
  verifyCaptchaToken:
      get:
        operationId: verifyCaptchaToken
        summary: "Verify google captcha token"
        description: "Verify google captcha token"
        tags:
          - Captcha
        parameters:
          - name: token
            in: query
            required: true
            description: "token generated from client-side"
            schema:
              type: string
        responses:
          '200':
            description: "Result of the verification"
            content:
              application/json:
                schema:
                  type: boolean
          400:
            $ref: './api.yml#/components/responses/400'
          500:
            $ref: './api.yml#/components/responses/500'

  whoami:
    get:
      tags:
        - Security
      summary: Who Am I? Tells you who you are
      operationId: whoami
      responses:
        200:
          description: Who you are
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Whoami'
        400:
          $ref: './api.yml#/components/responses/400'
        403:
          $ref: './api.yml#/components/responses/403'
        404:
          $ref: './api.yml#/components/responses/404'
        429:
          $ref: './api.yml#/components/responses/429'
        500:
          $ref: './api.yml#/components/responses/500'
  whois:
    get:
      tags:
        - Security
      summary: Who is ? Tells who is the mentioned user
      security: [ apikeyHeader: [ ] ]
      operation: whois
      parameters:
        - name: id
          in: path
          schema:
            type: string
          required: true
      responses:
        200:
          description: Who is the user
          content:
            application/json:
                schema:
                  $ref: '#/components/schemas/Whois'
        400:
          $ref: './api.yml#/components/responses/400'
        403:
          $ref: './api.yml#/components/responses/403'
        404:
          $ref: './api.yml#/components/responses/404'
        429:
          $ref: './api.yml#/components/responses/429'
        500:
          $ref: './api.yml#/components/responses/500'
  apiKeyOperations:
    get:
      tags:
        - Security
      summary: get authenticated user api key
      security: []
      operationId: findApiKey
      responses:
        200:
          description: Authenticated user api key
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/apiKey'
        400:
          $ref: './api.yml#/components/responses/400'
        403:
          $ref: './api.yml#/components/responses/403'
        404:
          $ref: './api.yml#/components/responses/404'
        429:
          $ref: './api.yml#/components/responses/429'
        500:
          $ref: './api.yml#/components/responses/500'
    delete:
      tags:
        - Security
      summary: Revoke api keys
      security: []
      operationId: revokeApiKeys
      requestBody:
        description: As an api key is unique and only linked to one user, we can identify the owner from the key.
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/RevokeApiKey'
      responses:
        200:
          description: List of revoked user api key
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "./userAccounts-api.yml#/components/schemas/UserApiKey"
        400:
          $ref: './api.yml#/components/responses/400'
        429:
          $ref: './api.yml#/components/responses/429'
        500:
          $ref: './api.yml#/components/responses/500'

components:
  securitySchemes:
    apiKeyHeader:
      type: apiKey
      in: header
      name: x-api-key
  schemas:
    Whoami:
      properties:
        user:
          $ref: './userAccounts-api.yml#/components/schemas/User'
    Whois:
      properties:
        user:
          $ref: './userAccounts-api.yml#/components/schemas/User'
    RevokeApiKey:
      type: object
      properties:
        key:
          type: string
    apiKey:
      type: object
      properties:
        apiKey:
          type: string
        userId:
          type: string