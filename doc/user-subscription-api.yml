operations:
  subscriptionConsumptionLog:
    get:
      tags:
        - User Subscription
      summary: Get user Subscription log
      operationId: getConsumptionLogsByUserId
      parameters:
        - in: path
          name: uId
          schema:
            type: string
          required: true
        - in: query
          name: from
          schema:
            type: string
            format: date
          required: false
        - in: query
          name: to
          schema:
            type: string
            format: date
          required: false
      response:
        200:
          description: List of user subscription consumption log
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SubscriptionConsumptionLog'
        400:
          $ref: './api.yml#/components/responses/400'
        403:
          $ref: './api.yml#/components/responses/403'
        404:
          $ref: './api.yml#/components/responses/404'
        429:
          $ref: './api.yml#/components/responses/429'
        500:
          $ref: './api.yml#/components/responses/500'
  registerUserSubscription:
    post:
      tags:
        - User Subscription
      summary: Subscribe user in stripe
      operationId: registerActiveUsersSubscription
      response:
        200:
          description: List of users registered
          application/json:
            schema:
              type: array
              items:
                $ref: './userAccounts-api.yml/#/components/schemas/User'
        400:
          $ref: './api.yml#/components/responses/400'
        403:
          $ref: './api.yml#/components/responses/403'
        404:
          $ref: './api.yml#/components/responses/404'
        429:
          $ref: './api.yml#/components/responses/429'
        500:
          $ref: './api.yml#/components/responses/500'
  initiateUserSubscription:
    post:
      tags:
        - User Subscription
      summary: Initiate user subscription
      operationId: initiateUserSubscription
      parameters:
        - in: path
          name: uId
          schema:
            type: string
          required: true
          description: User identifier
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSubscriptionInitiation'
      responses:
        200:
          description: The redirection urls to make subscription
          content:
            application/json:
              schema:
                $ref: './api.yml/#/components/schemas/Redirection'
        400:
          $ref: './api.yml#/components/responses/400'
        403:
          $ref: './api.yml#/components/responses/403'
        404:
          $ref: './api.yml#/components/responses/404'
        429:
          $ref: './api.yml#/components/responses/429'
        500:
          $ref: './api.yml#/components/responses/500'
  cancelUserSubscription:
    post:
      tags:
        - User Subscription
      summary: Cancel user subscription
      operationId: cancelUserSubscription
      description: |
        This operation cancel actual active subscription renewal. User still have access until the actual subscription end.
      parameters:
        - in: path
          name: uId
          schema:
            type: string
          required: true
          description: User identifier
      responses:
        200:
          description: User with cancelled subscription status
          content:
            application/json:
              schema:
                $ref: './userAccounts-api.yml/#/components/schemas/User'
        400:
          $ref: './api.yml#/components/responses/400'
        403:
          $ref: './api.yml#/components/responses/403'
        404:
          $ref: './api.yml#/components/responses/404'
        429:
          $ref: './api.yml#/components/responses/429'
        500:
          $ref: './api.yml#/components/responses/500'
components:
  schemas:
    SubscriptionConsumptionLog:
      type: object
      properties:
        id:
          type: string
          description: L'identifiant unique du journal de consommation.
        userId:
          type: string
          description: L'identifiant de l'utilisateur associé à cette consommation.
        usageMetric:
          type: integer
          format: int64
          description: La métrique d'utilisation associée à cette consommation.
        consumptionType:
          type: string
          enum:
            - ROOF_ANALYSIS
          description: Le type de consommation.
        consumptionUnit:
          type: string
          enum:
            - UNIT
          description: L'unité de consommation.
        comment:
          type: string
          description: Un commentaire optionnel associé à cette consommation.
        creationDatetime:
          type: string
          format: date-time
          description: La date et l'heure de création de cette entrée de journal.
    CreateSubscriptionInitiation:
      type: object
      properties:
        redirectionStatusUrls:
          $ref: './api.yml/#/components/schemas/RedirectionStatusUrls'
        subscriptionType:
          $ref: '#/components/schemas/UserSubscriptionType'
    UserSubscriptionType:
      type: string
      description: for now, only ESSENTIAL subscription is supported
      enum:
        - ESSENTIAL