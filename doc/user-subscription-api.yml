operations:
  subscriptionCommitmentsOperations:
    get:
      tags:
        - User Subscription
      summary: Get user subscription commitments
      operationId: getUserSubscriptionCommitments
      parameters:
        - in: path
          name: uId
          schema:
            type: string
          required: true
        - in: query
          name: page
          schema:
            $ref: './api.yml#/components/schemas/Page'
        - in: query
          name: pageSize
          schema:
            $ref: './api.yml#/components/schemas/PageSize'
      responses:
        200:
          description: List of user subscription commitments
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/UserSubscriptionCommitment'
        400:
          $ref: './api.yml#/components/responses/400'
        403:
          $ref: './api.yml#/components/responses/403'
        404:
          $ref: './api.yml#/components/responses/404'
        429:
          $ref: './api.yml#/components/responses/429'
        500:
          $ref: './api.yml#/components/responses/500'
    post:
      tags:
        - User Subscription
      summary: Save user subscription commitments
      operationId: saveUserSubscriptionCommitments
      parameters:
        - in: path
          name: uId
          schema:
            type: string
          required: true
      requestBody:
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/CreateUserSubscriptionCommitment'
      responses:
        '200':
          description: List of user subscription commitment consent saved
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/UserSubscriptionCommitment'
        400:
          $ref: './api.yml#/components/responses/400'
        403:
          $ref: './api.yml#/components/responses/403'
        404:
          $ref: './api.yml#/components/responses/404'
        429:
          $ref: './api.yml#/components/responses/429'
        500:
          $ref: './api.yml#/components/responses/500'

  subscriptionCommitmentAutoRenewalStatusOperation:
    post:
      tags:
        - User Subscription
      summary: Update the automatic renewal status of a user subscription commitment
      operationId: updateUserSubscriptionCommitmentAutoRenewalStatus
      parameters:
        - in: path
          name: uId
          schema:
            type: string
          required: true
        - in: path
          name: sId
          schema:
            type: string
          required: true
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserSubscriptionCommitmentAutoRenewalStatus'
      responses:
        '200':
          description: User subscription commitment with its updated automatic renewal status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserSubscriptionCommitment'
        400:
          $ref: './api.yml#/components/responses/400'
        403:
          $ref: './api.yml#/components/responses/403'
        404:
          $ref: './api.yml#/components/responses/404'
        429:
          $ref: './api.yml#/components/responses/429'
        500:
          $ref: './api.yml#/components/responses/500'

  subscriptionConsumptionLogsOperation:
    get:
      tags:
        - User Subscription
      summary: Get user Subscription log
      operationId: getConsumptionLogsByUserId
      parameters:
        - in: path
          name: uId
          schema:
            type: string
          required: true
        - in: query
          name: from
          schema:
            type: string
            format: date
          required: false
        - in: query
          name: to
          schema:
            type: string
            format: date
          required: false
      responses:
        200:
          description: List of user subscription consumption log
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SubscriptionConsumptionLog'
        400:
          $ref: './api.yml#/components/responses/400'
        403:
          $ref: './api.yml#/components/responses/403'
        404:
          $ref: './api.yml#/components/responses/404'
        429:
          $ref: './api.yml#/components/responses/429'
        500:
          $ref: './api.yml#/components/responses/500'
  subscriptionPlansOperation:
    get:
      tags:
        - User Subscription
      summary: List the subscribable subscription plans
      parameters:
        - in: query
          name: page
          schema:
            $ref: './api.yml#/components/schemas/Page'
        - in: query
          name: pageSize
          schema:
            $ref: './api.yml#/components/schemas/PageSize'
      operationId: getSubscriptionPlans
      responses:
        200:
          description: Available subscription plans
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SubscriptionPlan'
        403:
          $ref: './api.yml#/components/responses/403'
        429:
          $ref: './api.yml#/components/responses/429'
        500:
          $ref: './api.yml#/components/responses/500'
  paymentMethodsOperation:
    post:
      tags:
        - User Subscription
      summary: Initiate payment method insertion for later subscription
      operationId: initiatePaymentMethodInsertion
      parameters:
        - in: path
          name: uId
          schema:
            type: string
          required: true
          description: User identifier
      requestBody:
        content:
          application/json:
            schema:
              $ref: './api.yml#/components/schemas/RedirectionStatusUrls'
      responses:
        200:
          description: Redirection URL to access to setup payment method
          content:
            application/json:
              schema:
                $ref: './api.yml#/components/schemas/Redirection'
        400:
          $ref: './api.yml#/components/responses/400'
        403:
          $ref: './api.yml#/components/responses/403'
        404:
          $ref: './api.yml#/components/responses/404'
        429:
          $ref: './api.yml#/components/responses/429'
        500:
          $ref: './api.yml#/components/responses/500'
  billingPortalOperation:
    post:
      tags:
        - User Subscription
      summary: Initiate billing portal
      operationId: initiateBillingPortal
      parameters:
        - in: path
          name: uId
          schema:
            type: string
          required: true
          description: User identifier
      requestBody:
        content:
          application/json:
            schema:
              $ref: './api.yml#/components/schemas/RedirectionStatusUrls'
      responses:
        200:
          description: Redirection URL to access to billing portal
          content:
            application/json:
              schema:
                $ref: './api.yml#/components/schemas/Redirection'
        400:
          $ref: './api.yml#/components/responses/400'
        403:
          $ref: './api.yml#/components/responses/403'
        404:
          $ref: './api.yml#/components/responses/404'
        429:
          $ref: './api.yml#/components/responses/429'
        500:
          $ref: './api.yml#/components/responses/500'
  registerUserSubscription:
    post:
      tags:
        - User Subscription
      summary: Subscribe user in stripe
      operationId: registerActiveUsersSubscription
      response:
        200:
          description: List of users registered
          application/json:
            schema:
              type: array
              items:
                $ref: './userAccounts-api.yml#/components/schemas/User'
        400:
          $ref: './api.yml#/components/responses/400'
        403:
          $ref: './api.yml#/components/responses/403'
        404:
          $ref: './api.yml#/components/responses/404'
        429:
          $ref: './api.yml#/components/responses/429'
        500:
          $ref: './api.yml#/components/responses/500'
  initiateUserSubscription:
    post:
      tags:
        - User Subscription
      summary: Initiate user subscription
      operationId: initiateUserSubscription
      parameters:
        - in: path
          name: uId
          schema:
            type: string
          required: true
          description: User identifier
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSubscriptionInitiation'
      responses:
        200:
          description: The redirection urls to make subscription
          content:
            application/json:
              schema:
                $ref: './api.yml#/components/schemas/Redirection'
        400:
          $ref: './api.yml#/components/responses/400'
        403:
          $ref: './api.yml#/components/responses/403'
        404:
          $ref: './api.yml#/components/responses/404'
        429:
          $ref: './api.yml#/components/responses/429'
        500:
          $ref: './api.yml#/components/responses/500'
  cancelUserSubscription:
    post:
      tags:
        - User Subscription
      summary: Cancel user subscription
      operationId: cancelUserSubscription
      description: |
        This operation cancel actual active subscription renewal. User still have access until the actual subscription end.
      parameters:
        - in: path
          name: uId
          schema:
            type: string
          required: true
          description: User identifier
      responses:
        200:
          description: User with cancelled subscription status
          content:
            application/json:
              schema:
                $ref: './userAccounts-api.yml#/components/schemas/User'
        400:
          $ref: './api.yml#/components/responses/400'
        403:
          $ref: './api.yml#/components/responses/403'
        404:
          $ref: './api.yml#/components/responses/404'
        429:
          $ref: './api.yml#/components/responses/429'
        500:
          $ref: './api.yml#/components/responses/500'
components:
  schemas:
    SubscriptionConsumptionLog:
      type: object
      properties:
        id:
          type: string
        userId:
          type: string
        usageMetric:
          type: integer
          format: int64
        consumptionType:
          $ref: '#/components/schemas/ConsumptionType'
        consumptionUnit:
          $ref: '#/components/schemas/ConsumptionUnit'
        comment:
          type: string
        creationDatetime:
          type: string
          format: date-time
    ConsumptionType:
      type: string
      description: |
        ROOF_ANALYSIS is the only billable consumption. IMAGE_ACCESS only tracks
        that an area picture has been read from an external source.
      enum:
        - ROOF_ANALYSIS
        - IMAGE_ACCESS
    ConsumptionUnit:
      type: string
      enum:
        - UNIT
    CreateSubscriptionInitiation:
      type: object
      properties:
        redirectionStatusUrls:
          $ref: './api.yml#/components/schemas/RedirectionStatusUrls'
        subscriptionType:
          $ref: '#/components/schemas/UserSubscriptionType'
        subscriptionPlanIdentifier:
          type: string
          description: |
            Identifier of the chosen plan (see GET /subscriptionPlans). When provided it takes
            precedence over subscriptionType, enabling data-driven plan selection.
    UserSubscriptionType:
      type: string
      description: for now, only ESSENTIAL subscription is supported
      enum:
        - ESSENTIAL
    SubscriptionBillingType:
      type: string
      enum:
        - COMMITMENT
        - USAGE_BASED
    SubscriptionPlanDescription:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
        features:
          type: array
          items:
            type: string
        billingType:
          $ref: '#/components/schemas/SubscriptionBillingType'
        priceInCentsWithVat:
          type: integer
          format: int64
          description: Monthly fixed price, VAT included (TTC), in cents.
        priceInCentsWithoutVat:
          type: integer
          format: int64
          description: Monthly fixed price, VAT excluded (HT), in cents.
        vatPercent:
          type: integer
          format: int64
          description: VAT rate in basis points of 10_000 (2000 = 20%), values between 0 and 10_000.
        isMostChosen:
          type: boolean
        isDeprecated:
          type: boolean
          description: For deprecated plans to not be shown in consumer usage.
        displayPosition:
          type: integer
          minimum: 1
          maximum: 4
          description: Corresponds to the left-to-right position to be displayed at the consumer end
    SubscriptionPlan:
      allOf:
        - $ref: '#/components/schemas/SubscriptionPlanDescription'
        - type: object
          properties:
            freeUsageThreshold:
              type: integer
              format: int64
              description: Analyses included each month before the overage price applies.
            overageUnitPriceInCents:
              type: integer
              format: int64
              description: Price, HT in cents, of each analysis beyond the included quota.
            trialPeriodDays:
              type: integer
            annualDiscountPercent:
              type: integer
              description: Discount, in percent, on the yearly prepaid fixed price.
    UserSubscriptionCommitmentDetails:
      type: object
      properties:
        commitmentStart:
          type: string
          format: date-time
        duration:
          $ref: '#/components/schemas/UserSubscriptionCommitmentDuration'
        approvalDatetime:
          type: string
          format: date-time
        automaticRenewalStatus:
          $ref: './api.yml#/components/schemas/EnableStatus'
    UserSubscriptionCommitmentDuration:
      type: string
      enum: [ 'TWELVE_MONTHS' ]
    UpdateUserSubscriptionCommitmentAutoRenewalStatus:
      type: object
      properties:
        automaticRenewalStatus:
          $ref: './api.yml#/components/schemas/EnableStatus'
    CreateUserSubscriptionCommitment:
      allOf:
        - $ref: '#/components/schemas/UserSubscriptionCommitmentDetails'
        - type: object
          properties:
            subscriptionPlanIdentifier:
              type: string
    UserSubscriptionCommitment:
      allOf:
        - $ref: '#/components/schemas/UserSubscriptionCommitmentDetails'
        - type: object
          properties:
            id:
              type: string
            subscriptionPlan:
              $ref: '#/components/schemas/SubscriptionPlanDescription'
            commitmentEnd:
              type: string
              format: date-time