compute:
  api_gateway_timeout: 900000
  frontal_function_invocation_method: lambda-url
  frontal_function_timeout: 900
  frontal_memory: 2048
  workers:
    - batch: 1
      memory: 1024
      reserved_concurrent_executions_nb: 30
      timeout: 600
    - batch: 1
      memory: 2048
      reserved_concurrent_executions_nb: 30
      timeout: 600
concurrency:
  frontal_reserved_concurrent_executions_nb: 20
database:
  with_database: non-poja-managed-postgres
emailing:
  ses_source: contact@birdia.fr
gen_api_client:
  aws_account_id: '688605879718'
  codeartifact_domain_name: npm-bpartners-app
  codeartifact_repository_name: bpartners-store
  ts_client_api_url_env_var_name: REACT_APP_BPARTNERS_API_URL
  ts_client_default_openapi_server_url: api.prod.bpartners.app
  with_gen_clients: 'true'
  with_publish_to_npm_registry: 'true'
general:
  app_name: bpartners
  cli_version: 21.6.0
  custom_java_deps: poja-custom-java-deps.txt
  custom_java_env_vars: poja-custom-java-env-vars.txt
  custom_java_repositories: poja-custom-java-repositories.txt
  java_main_class: PojaApplication
  package_full_name: app.bpartners.api
  poja_domain_owner: 088312068315
  poja_python_repository_domain: python-numer-tech
  poja_python_repository_name: numer-python-store
  with_snapstart: 'true'
integration:
  with_codeql: 'false'
  with_file_storage: 'true'
  with_sentry: 'true'
  with_sonar: 'true'
  with_swagger_ui: 'false'
networking:
  region: eu-west-3
  ssm_sg_id: /bpartners/sg/id
  ssm_subnet1_id: /bpartners/private/subnet1/id
  ssm_subnet2_id: /bpartners/private/subnet2/id
  with_own_vpc: 'true'
scheduled_tasks: null
testing:
  custom_java_gradle_test_args: poja-custom-java-gradle-test-args.txt
  custom_java_test_env_vars: poja-custom-java-test-env-vars.txt
  jacoco_min_coverage: '0.4'
  java_facade_it: app.bpartners.api.integration.conf.MockedThirdParties
  max_heap_size: '2g'
  min_heap_size: '512m'
  stack_size: null