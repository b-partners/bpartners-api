<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <style>
        * {
            color: #2b2b2a;
            box-sizing: border-box;
            font-family: 'Kumbh Sans', Arial, Verdana;
            padding: 0;
            margin: 0;
        }

        html {
            font-size: 12px;
        }

        @page { size: A4; }

        .page {
            width: 100%;
            display: block;
            position: relative;
            page-break-after: always;
        }

        .last-page { page-break-after: avoid; }

        .title {
            font-size: 1.7rem; /* ~ 20px */
            text-align: center;
            font-weight: bold !important;
            margin: 50px auto 50px auto;
        }

        .title-value {
            color: #FF521B;
            margin: 5px 0px;
        }

        .main-image {
            display: block;
            width: 550px;
            margin: 20px auto 0px auto;
        }

        .image-wrapper {
            text-align: center;
        }

        .main-image-3d {
            display: inline-block;
            height: 320px;
        }

        .annotation-item {
            display: table;
            width: 100%;
            margin-top: 20px;
            table-layout: fixed;
            page-break-inside: avoid;
        }

        .annotation-item:last-child {
            border-bottom: none;
        }

        .annotation-item-labels {
            display: table-cell;
            width: calc(100% - 320px);
            vertical-align: top;
            word-wrap: break-word;
            white-space: normal;
        }

        /* CORRECTION : Colonne droite pour les images du bâtiment (68%) */
        .annotation-item-image-container {
            display: table-cell;
            width: 68%;
            vertical-align: middle;
            text-align: center;
        }

        /* Gestion de l'affichage des images du bâtiment côte à côte */
        .building-images-row {
            display: table;
            width: 100%;
            table-layout: fixed;
            border-collapse: separate;
            border-spacing: 10px 0;
        }

        .building-image-cell {
            display: table-cell;
            width: 50%;
            vertical-align: middle;
            text-align: center;
        }


        .annotation-item-image {
            display: block;
            width: 300px;
            margin-left: auto;
            height: auto;
        }

        .annotation-item-image-3d {
            max-width: 100%;
            height: 140px;
            width: 100%;
            object-fit: contain;
            vertical-align: middle;
        }

        .annotation-blank-item-image-3d {
            width: 100%;
            height: 140px;
            display: block;
            background-color: #756c6c;
            color: white;
            text-align: center;
            line-height: 140px;
            border-radius: 4px;
            font-size: 11px;
        }

        .annotation-information-title {
            font-size: 1.5rem; /* 18px */
            margin-bottom: 20px;
            font-weight: bold;
            color: #FF521B;
            text-align: center;
            page-break-after: avoid;
        }

        .annotation-item-title { font-size: 1.1rem; font-weight: bold; margin-bottom: 8px; }
        .annotation-item-title-value { margin-right: 15px; }
        .annotation-item-info-label { font-weight: bold; }
        .annotation-item-info-value { font-weight: normal; }
        .annotation-item-info-item {
            font-size: 1rem; /* 12px */
            margin: 6px 0;
        }

        .roof-slope-boundaries-legend {
            margin-bottom: 12px;
            line-height: 2;
        }

        .legend-item {
            display: inline-block;
            white-space: nowrap;
            margin-right: 16px;
            vertical-align: middle;
        }

        .legend-item img {
            vertical-align: middle;
            width: 32px;
            height: 16px;
        }

        .legend-item span {
            font-size: 11px;
            vertical-align: middle;
        }

        .degradation-container {
            width: 100%;
            border-collapse: collapse;
            table-layout: fixed;
        }

        .degradation-left {
            text-align: left;
            vertical-align: middle;
            padding-left: 10px;
            width: 65%;
        }

        .degradation-right {
            text-align: right;
            vertical-align: middle;
            padding-right: 10px;
            width: 35%;
        }

        .degradation-levels td {
            width: 40px;
            height: 40px;
            border-radius: 6px;
            text-align: center;
            vertical-align: middle;
            font-weight: bold;
            color: black;
            border: 2px solid transparent;
        }

        .degradation-levels td.active {
            border: 3px solid black;
        }

        .degradation-score {
            display: inline-block;
            background-color: #4A644E;
            color: white;
            font-size: 14px;
            padding: 10px 12px;
            border-radius: 6px;
            font-weight: bold;
            white-space: nowrap;
            vertical-align: middle;
        }

        .degradation-score span {
            color: white;
        }

        /* LLM */
        .llm h2 {
            font-size: 1.5rem !important; /* 18px */
            color: #FF521B;
            text-align: center;
            font-weight: bold;
            margin-top: 20px;
            margin-bottom: 15px;
        }

        .llm h3 {
            color: #000000;
            font-size: 1.25rem !important; /* 15 */
            text-align: center;
            font-weight: bold;
            margin-top: 15px;
            margin-bottom: 10px;
        }

        .llm section ul {
            list-style-type: disc;
            padding-left: 0;
            margin: 0 auto;
            max-width: 100%;
        }

        .llm section ul li {
            margin: 8px 0;
            line-height: 1.5;
            text-align: justify;
        }

        .emoji svg,
        .emoji img {
            width: 1em;                 /* match text height */
            height: 1em;                /* ensure square emoji */
            display: inline-block;
        }

        .footer-info {
            width: 100%;
            padding-top: 40px;
        }

        .footer-info table {
            width: 100%;
        }

        .footer-info td {
            padding-left: 40px;
            text-align: left;
            vertical-align: middle;
        }

        .footer-logo {
            max-height: 120px;
            margin-top: 20px;
            display: block;
        }

        /* STYLES COMPLETS POUR LA SECTION DES PANS 3D */
        .pan-col-headers {
            display: table;
            width: 100%;
            table-layout: fixed;
            margin-bottom: 8px;
        }

        .pan-col-header {
            display: table-cell;
            width: 50%;
            text-align: center;
            font-size: 10px;
            color: #999;
            padding: 5px;
            background-color: #f7f7f7;
            border-radius: 4px;
        }

        .pan-annotation-content {
            display: table;
            width: 100%;
            table-layout: fixed;
        }

        .pan-annotation-labels {
            display: table-cell;
            width: 32%;
            vertical-align: middle;
            padding-right: 18px;
            word-wrap: break-word;
        }

        .pan-annotation-images {
            display: table-cell;
            width: 68%;
            vertical-align: middle;
        }

        .pan-images-row {
            display: table;
            width: 100%;
            table-layout: fixed;
            border-collapse: separate;
            border-spacing: 10px 0;
        }

        .pan-image-cell {
            display: table-cell;
            width: 50%;
            vertical-align: middle;
            text-align: center;
        }

    </style>
    <meta charset="UTF-8"/>
    <title>Rapport d'analyse</title>
</head>
<body>
<section class="page">
    <h1 class="title">
        <span class="title-label">Rapport d'analyse de l'adresse : </span>
        <br />
        <span class="title-value" th:text="${address} ?: 'Non renseigné'"></span>
    </h1>
    <img alt="annotation" class="main-image" th:src="${mainImage}"/>
    <table class="degradation-container" th:if="${globalRateType != null}">
        <tr>
            <td class="degradation-left">
                <table class="degradation-levels">
                    <tr>
                        <td th:each="level : ${degradationLevels}"
                            th:classappend="${level.label == globalRateType} ? ' active' : ''"
                            th:style="'background-color:' + ${level.color}">
                            <span th:text="${level.label}"></span>
                        </td>
                    </tr>
                </table>
            </td>
            <td class="degradation-right" th:if="${globalRateValue}">
                <div class="degradation-score">
                    <span th:text="'NOTE DE DÉGRADATION GLOBALE : ' + ${globalRateValue} + '%'"></span>
                </div>
            </td>
        </tr>
    </table>
    <div class="footer-info">
        <table>
            <tr>
                <td>
                    <div th:text="${user.getName()}"></div>
                    <div th:text="${address}"></div>
                    <div th:text="${user.getMobilePhoneNumber()}"></div>
                    <div th:text="${user.getEmail()}"></div>
                    <div th:if="${userWebsite}">
                        <a th:href="${userWebsite}" th:text="${userWebsite}"></a>
                    </div>
                </td>

                <td th:if="${logo!=null}">
                    <img class="footer-logo" th:src="${logo}" alt="logo"/>
                </td>
            </tr>
        </table>
    </div>
</section>

<section th:each="page, pageStat : ${pages}" class="page" th:classappend="${pageStat.last and llm == null and pages3D == null} ? ' last-page' : ''">
    <h2 class="annotation-information-title"> Information sur le bâtiment </h2>

    <div th:each="annotation, annotationStat : ${page}" class="annotation-item">
        <div class="annotation-item-labels">
            <h4 class="annotation-item-title">
                <span class="annotation-item-title-value" th:text="${annotation.mergedInstance().labelName} ?: 'Non renseigné'"></span>
            </h4>
            <p class="annotation-item-info-item" th:each="info : ${annotation.infos}">
                <span class="annotation-item-info-label" th:text="${info.label} ?: 'Non renseigné'"></span>:
                <span class="annotation-item-info-value" th:text="${info.value} ?: 'Non renseigné'"></span>
            </p>
        </div>

        <div class="annotation-item-image-container">
            <div class="building-images-row">
                <div class="building-image-cell">
                    <img
                            class="annotation-item-image"
                            alt="annotation sub-image"
                            th:if="${subImagesPages[pageStat.index] != null and subImagesPages[pageStat.index].size() > annotationStat.index}"
                            th:src="${subImagesPages[pageStat.index][annotationStat.index]}"
                    />
                </div>
            </div>
        </div>
    </div>
</section>

<section th:if="${pages3D}" th:each="page, pageStat : ${pages3D}"
         class="page"
         th:classappend="${pageStat.last and llm == null} ? ' last-page' : ''">

    <h2 class="annotation-information-title"> Informations détaillées sur les pans du bâtiment </h2>

    <div class="image-wrapper" th:if="${pageStat.first}">
        <img alt="annotation-3d" class="main-image-3d" th:src="${mainImage3D}" />
    </div>

    <div class="roof-slope-boundaries-legend">
        <div class="legend-item" th:each="type : ${roofSlopeBoundariesPerPage[pageStat.index]}">
            <img th:src="${roofSlopeBoundariesImages[type]}"
                 th:alt="${type}"
                 style="width: 32px; height: 16px; object-fit: contain;" />
            <span th:text="${type}"></span>
        </div>
    </div>

    <div style="display:table; width:100%; table-layout:fixed; margin-bottom:10px;">
        <div style="display:table-cell; width:32%;"></div>
        <div style="display:table-cell; width:68%;">
            <div class="pan-col-headers">
                <div class="pan-col-header">Photo façade / Vue 3D</div>
                <div class="pan-col-header">Image annotée</div>
            </div>
        </div>
    </div>

    <div th:each="pan, panStat: ${page}" class="annotation-item">
        <div class="pan-annotation-content">

            <div class="pan-annotation-labels">
                <h4 class="annotation-item-title">
                    <span class="annotation-item-title-value" th:text="${pan.name} ?: 'Non renseigné'"></span>
                </h4>
                <div class="annotation-item-info-item" th:each="info : ${pan.infos}">

                    <span th:if="${info != null and info.label != 'edgeTypes'}">
                        <span class="annotation-item-info-label" th:text="${info.label} ?: 'Non renseigné'"></span>:
                        <span class="annotation-item-info-value" th:text="${info.value} ?: 'Non renseigné'"></span>
                    </span>
                </div>
            </div>

            <div class="pan-annotation-images">
                <div class="pan-images-row">

                    <div class="pan-image-cell">
                        <img class="annotation-item-image-3d" alt="annotation 3d sub-image"
                             th:if="${pansImages3DUris[pageStat.index] != null
                                     and pansImages3DUris[pageStat.index].size() > panStat.index
                                     and pansImages3DUris[pageStat.index][panStat.index] != null}"
                             th:src="${pansImages3DUris[pageStat.index][panStat.index]}" />

                        <div class="annotation-blank-item-image-3d"
                             th:if="${pansImages3DUris == null
                                     or pansImages3DUris.size() <= pageStat.index
                                     or pansImages3DUris[pageStat.index] == null
                                     or pansImages3DUris[pageStat.index].size() <= panStat.index
                                     or pansImages3DUris[pageStat.index][panStat.index] == null}">
                            Image indisponible
                        </div>
                    </div>

                    <div class="pan-image-cell">
                        <img class="annotation-item-image-3d" alt="annotation sub-image"
                             th:if="${subImagesPages3D[pageStat.index] != null and subImagesPages3D[pageStat.index].size() > panStat.index}"
                             th:src="${subImagesPages3D[pageStat.index][panStat.index]}" />

                        <div class="annotation-blank-item-image-3d"
                             th:if="${subImagesPages3D[pageStat.index] == null or subImagesPages3D[pageStat.index].size() <= panStat.index}">
                            Image indisponible
                        </div>
                    </div>

                </div>
            </div>

        </div>
    </div>
</section>

<section class="llm page last-page" th:if="${llm}">
    <div th:utext="${llm}"></div>
</section>
</body>
</html>
