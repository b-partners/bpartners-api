<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <style>
        * {
            color: #2b2b2a;
            box-sizing: border-box;
            font-family: 'Kumbh Sans', Arial, Verdana;
            padding: 0;
            margin: 0;
        }

        @page { size: A4; }

        .page {
            width: 100%;
            display: block;
            position: relative;
            page-break-after: always;
        }

        .last-page { page-break-after: avoid; }

        .title {
            font-size: 30px;
            text-align: center;
            font-weight: bold !important;
            margin: 50px auto 50px auto;
        }

        .title-value {
            color: #FF521B;
            margin: 5px 0px;
        }

        .main-image {
            display: block;
            width: 550px;
            margin: 20px auto 0px auto;
        }

        .main-image-3d {
            display: block;
            width: 400px;
            margin: 50px auto 30px auto;
        }

        .annotation-item{
            display: table;
            width: 100%;
            margin-top: 20px;
        }

        .annotation-item-labels{
            display: table-cell;
            width: calc(100% - 320px);
            vertical-align: top;
            word-wrap: break-word;
            overflow-wrap: break-word;
            white-space: normal;
        }

        .annotation-item-image{
            display: block;
            width: 300px;
            margin-left: auto; /* align to right */
            height: auto;
        }

        .annotation-item-image-3d{
            display: block;
            width: 400px;
            margin-left: auto;
            height: auto;
        }

        .annotation-information-title{
            font-size: 30px;
            margin-bottom: 10px;
            font-weight: bold;
            color: #FF521B;
            text-align: center;
        }

        .annotation-item-title{ font-size: 16px; }
        .annotation-item-title-value{ margin-right: 15px; }
        .annotation-item-info-label{ font-weight: bold; }
        .annotation-item-info-value{ font-weight: normal; }
        .annotation-item-title-color {
            display: none;
            width: 1px;
            height: 10px;
            border-radius: 3px;
            border: 10px solid;
            margin-left: 5px;
        }
        .annotation-item-info-item {
            font-size: 16px;
            margin: 5px 0;
        }

        .degradation-container {
            width: 100%;
            border-collapse: collapse;
            table-layout: fixed;
        }

        .degradation-left {
            text-align: left;
            vertical-align: middle;
            padding-left: 10px;
            width: 65%;
        }

        .degradation-right {
            text-align: right;
            vertical-align: middle;
            padding-right: 10px;
            width: 35%;
        }

        .degradation-levels td {
            width: 40px;
            height: 40px;
            border-radius: 6px;
            text-align: center;
            vertical-align: middle;
            font-weight: bold;
            color: black;
            border: 2px solid transparent;
        }

        .degradation-levels td.active {
            border: 3px solid black;
        }

        .degradation-score {
            display: inline-block;
            background-color: #4A644E;
            color: white;
            font-size: 14px;
            padding: 10px 12px;
            border-radius: 6px;
            font-weight: bold;
            white-space: nowrap;
            vertical-align: middle;
        }

        .degradation-score span {
            color: white;
        }

        /* LLM */
        .llm h2 {
            font-size: 30px !important;
            color: #FF521B;
            text-align: center;
            font-weight: bold;
            margin-top: 20px;
            margin-bottom: 15px;
        }

        .llm h3 {
            color: #000000;
            font-size: 25px !important;
            text-align: center;
            font-weight: bold;
            margin-top: 15px;
            margin-bottom: 10px;
        }

        .llm section ul {
            list-style-type: dot;
            padding-left: 0;
            margin: 0 auto;
            max-width: 100%;
        }

        .llm section ul li {
            margin: 8px 0;
            line-height: 1.5;
            text-align: justify;
        }

        .emoji {
            display: inline-block;
            line-height: 1;             /* size based on font-size */
            vertical-align: -0.125em;   /* align baseline similar to text glyphs */
        }
        .emoji svg,
        .emoji img {
            width: 1em;                 /* match text height */
            height: 1em;                /* ensure square emoji */
            display: inline-block;
        }

    </style>
    <meta charset="UTF-8"/>
    <title>Rapport d'analyse</title>
</head>
<body>
    <section class="page">
        <h1 class="title">
            <span class="title-label">Rapport d'analyse de l'adresse : </span>
            <br />
            <span class="title-value" th:text="${address} ?: 'Non renseigné'"></span>
        </h1>
        <img alt="annotation" class="main-image" th:src="${mainImage}"/>
        <table class="degradation-container" th:if="${globalRateType != null}">
            <tr>
                <td class="degradation-left">
                    <table class="degradation-levels">
                        <tr>
                            <td th:each="level : ${degradationLevels}"
                                th:classappend="${level.label == globalRateType} ? ' active' : ''"
                                th:style="'background-color:' + ${level.color}">
                                <span th:text="${level.label}"></span>
                            </td>
                        </tr>
                    </table>
                </td>
                <td class="degradation-right">
                    <div class="degradation-score">
                        <span th:text="'NOTE DE DÉGRADATION GLOBALE : ' + ${globalRateValue} + '%'"></span>
                    </div>
                </td>
            </tr>
        </table>
    </section>
    <section th:each="page, pageStat : ${pages}" class="page" th:classappend="${pageStat.last and llm == null and pages3D == null} ? ' last-page' : ''">
        <h2 class="annotation-information-title"> Informations des annotations </h2>
        <div th:each="annotation, annotationStat : ${page}" class="annotation-item">
            <div class="annotation-item-labels">
                <h4 class="annotation-item-title">
                    <span class="annotation-item-title-value" th:text="${annotation.mergedInstance().labelName} ?: 'Non renseigné'"></span>
                </h4>
                <p class="annotation-item-info-item" th:each="info : ${annotation.infos}">
                    <span class="annotation-item-info-label" th:text="${info.label} ?: 'Non renseigné'"></span>
                    <span>:</span>
                    <span class="annotation-item-info-value" th:text="${info.value} ?: 'Non renseigné'"></span>
                </p>
            </div>
            <img
                class="annotation-item-image"
                alt="annotation sub-image"
                th:src="${subImages[page.size() * pageStat.index + annotationStat.index]}"
            />
        </div>
    </section>
    <section th:if="${pages3D}" th:each="page, pageStat : ${pages3D}" class="page" th:classappend="${pageStat.last and llm == null} ? ' last-page' : ''">
        <h2 class="annotation-information-title"> Représentation générale du bâtiment 3D </h2>
        <img alt="annotation-3d" class="main-image-3d" th:src="${mainImage3D}" th:if="${pageStat.first}" />
        <div th:each="pan, panStat: ${page}" class="annotation-item">
            <div class="annotation-item-labels">
                <h4 class="annotation-item-title">
                    <span class="annotation-item-title-value" th:text="${pan.name} ?: 'Non renseigné'"></span>
                </h4>
                <p class="annotation-item-info-item" th:each="info : ${pan.infos}">
                    <span class="annotation-item-info-label" th:text="${info.label} ?: 'Non renseigné'"></span>
                    <span>:</span>
                    <span class="annotation-item-info-value" th:text="${info.value} ?: 'Non renseigné'"></span>
                </p>
            </div>
            <img
                class="annotation-item-image-3d"
                alt="annotation sub-image"
                th:src="${subImages3D[page.size() * pageStat.index + panStat.index]}"
            />
        </div>
    </section>
    <section class="llm page last-page" th:if="${llm}">
        <div th:utext="${llm}"></div>
    </section>
</body>
</html>
