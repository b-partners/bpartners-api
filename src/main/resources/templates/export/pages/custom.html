<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<section th:fragment="page" th:each="page, pageStat : ${customPages}" class="page" th:classappend="${pageStat.last and customPagesIsLast} ? ' last-page' : ''">
    <h2 class="custom-page-title" th:text="${page.pageTitle}"></h2>

    <div th:each="section : ${page.sections}" class="custom-section" th:switch="${section.type.name()}">

        <!-- 1. TEXT Section -->
        <div th:case="'TEXT'" th:class="'custom-section-text text-priority-' + ${section.priority.name()}" th:text="${section.text}"></div>

        <!-- 2. IMAGE Section -->
        <div th:case="'IMAGE'" class="custom-section-image-container">
            <img class="custom-section-image" th:classappend="'image-priority-' + ${section.priority.name()}" th:src="${section.url}" alt="custom section image"/>
            <div th:if="${section.caption}" class="custom-section-caption" th:text="${section.caption}"></div>
        </div>

        <!-- 3. TABLE Section -->
        <div class="degradation-container" th:case="'TABLE'">
            <table class="data-table">
                <thead>
                <tr>
                    <th th:each="header : ${section.tableData.headers}" th:text="${header}"></th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="row : ${section.tableData.rows}">
                    <td th:each="cell : ${row}" th:text="${cell}"></td>
                </tr>
                </tbody>
            </table>
        </div>

        <!-- 4. SPLIT_SECTION (side-by-side columns) -->
        <div th:case="'SPLIT_SECTION'" class="clearfix split-section" th:classappend="'split-' + ${#lists.size(section.columns)}">
            <div th:each="column, columnStat : ${section.columns}" class="split-column"
                 th:classappend="${columnStat.first} ? ' split-first' : (${columnStat.last} ? ' split-last' : ' split-middle')">
                <div th:with="section=${column}" th:insert="~{export/pages/custom :: renderChildSection}"></div>
            </div>
        </div>
    </div>
</section>

<!-- Reusable Fragment Engine -->
<div th:fragment="renderChildSection" th:switch="${section != null ? section.type.name() : ''}" th:remove="tag">
    <!-- Child TEXT -->
    <div th:case="'TEXT'" th:class="'custom-section-text text-priority-' + ${section.priority.name()}" th:text="${section.text}"></div>

    <!-- Child IMAGE -->
    <div th:case="'IMAGE'" class="custom-section-image-container" style="text-align: center;">
        <img class="custom-section-image" th:classappend="'image-priority-' + ${section.priority.name()}" th:src="${section.url}" alt="custom section image"/>
        <div th:if="${section.caption}" class="custom-section-caption" th:text="${section.caption}"></div>
    </div>

    <!-- Child TABLE -->
    <div class="degradation-container" th:case="'TABLE'" style="margin-top: 5px;">
        <table class="data-table">
            <thead>
            <tr>
                <th th:each="header : ${section.tableData.headers}" th:text="${header}"></th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="row : ${section.tableData.rows}">
                <td th:each="cell : ${row}" th:text="${cell}"></td>
            </tr>
            </tbody>
        </table>
    </div>
</div>
</body>
</html>
