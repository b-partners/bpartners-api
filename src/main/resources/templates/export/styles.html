<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
    <style th:fragment="styles">
        * {
            color: #2b2b2a;
            box-sizing: border-box;
            font-family: 'Kumbh Sans', Arial, Verdana;
            padding: 0;
            margin: 0;
        }

        html, body {
            font-size: 12px;
            background: #ffffff;
        }

        @page {
            size: A4;
            margin: 20px 32px;
        }

        /* Prevent trailing blank page at the end of document rendering */
        body > .page:last-child,
        body > section:last-child {
            page-break-after: avoid !important;
        }

        /* Standard page blocks using structural margins rather than flex/table constraints */
        .page {
            width: 100%;
            display: block;
            position: relative;
            page-break-after: always;
            page-break-inside: avoid;
        }

        /* Clearfix utility to fix floated containers without using display:table */
        .clearfix::after {
            content: "";
            clear: both;
            display: block;
        }

        /* Safe alternative to hardcoded max-height; prevents inner overflow cleanly */
        .diagram-page {
            page-break-inside: avoid;
        }

        /* Fixed structural containers replacing flex layouts */
        .summary-page {
            display: block;
        }

        .summary-image-large {
            display: block;
            width: 100%;
            max-height: 480px;
            margin: 0 auto;
        }

        .last-page {
            page-break-after: avoid !important;
        }

        body > section.page:last-child {
            page-break-after: avoid !important;
        }

        .diagram-page-image {
            display: block;
            max-width: 100%;
            max-height: 800px;
            width: auto;
            height: auto;
            margin: 16px auto 0 auto;
        }

        .title {
            font-size: 1.7rem;
            text-align: center;
            font-weight: bold;
            margin: 20px auto;
        }

        .title-value {
            color: #FF521B;
            margin: 5px 0px;
        }

        .main-image {
            display: inline-block;
            max-width: 650px;
            max-height: 480px;
            width: auto;
            height: auto;
        }

        .image-wrapper {
            text-align: center;
            display: block;
            width: 100%;
            margin-bottom: 15px;
        }

        .main-image-3d {
            display: inline-block;
            height: 320px;
        }

        /* Annotation Layout Redesigned using Standard Block Float Mechanics */
        .annotation-item {
            display: block;
            width: 100%;
            margin-top: 16px;
            margin-bottom: 16px;
            padding: 14px;
            border: 0.5px solid #e8e8e8;
            border-radius: 6px;
            background-color: #fafafa;
            page-break-inside: avoid;
        }

        .annotation-item-labels {
            display: block;
            float: left;
            width: 30%;
            vertical-align: top;
            word-wrap: break-word;
        }

        .annotation-item-image-container {
            display: block;
            float: right;
            width: 68%;
            text-align: center;
        }

        /* Replaced display:table with block rows and column formatting */
        .building-images-row {
            display: block;
            width: 100%;
        }

        .building-image-cell {
            display: block;
            width: 100%;
            text-align: right;
        }

        .annotation-item-image {
            display: inline-block;
            width: 300px;
            height: auto;
        }

        .annotation-item-image-3d {
            display: block;
            max-width: 100%;
            height: 140px;
            width: 100%;
        }

        .annotation-blank-item-image-3d {
            width: 100%;
            height: 140px;
            display: block;
            background-color: #756c6c;
            color: white;
            text-align: center;
            line-height: 140px;
            border-radius: 4px;
            font-size: 11px;
        }

        .annotation-information-title {
            font-size: 1.4rem;
            margin-bottom: 8px;
            font-weight: 600;
            color: #2b2b2a;
            text-align: left;
            page-break-after: avoid;
            padding-bottom: 10px;
            border-bottom: 2.5px solid #FF521B;
        }

        .section-description {
            font-size: 0.9rem;
            color: #888;
            text-align: left;
            margin-bottom: 20px;
            line-height: 1.5;
        }

        .annotation-item-title { 
            font-size: 1.05rem; 
            font-weight: 600; 
            margin-bottom: 10px; 
            color: #2b2b2a;
            padding-left: 8px;
            border-left: 3px solid #FF521B;
        }
        .annotation-item-title-value { 
            margin-right: 15px; 
            color: #FF521B;
        }
        .annotation-item-info-label { 
            font-weight: 600; 
            color: #666;
        }
        .annotation-item-info-value { 
            font-weight: normal; 
            color: #2b2b2a;
        }
        .annotation-item-info-item {
            font-size: 0.95rem;
            margin: 6px 0;
            line-height: 1.5;
        }

        .roof-slope-boundaries-legend {
            margin-bottom: 12px;
            line-height: 2;
            display: block;
            width: 100%;
        }

        .legend-item {
            display: inline-block;
            white-space: nowrap;
            margin-right: 16px;
        }

        .legend-item img {
            vertical-align: middle;
            width: 32px;
            height: 16px;
        }

        .legend-item span {
            font-size: 11px;
            vertical-align: middle;
        }

        .degradation-container {
            display: block;
            width: 100%;
            border: 0.5px solid #e8e8e8;
            border-radius: 6px;
            padding: 16px;
            margin-bottom: 20px;
            background-color: #ffffff;
            page-break-inside: avoid;
        }

        .degradation-section-title {
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 0.05em;
            color: #888;
            margin: 0 0 14px;
            text-transform: uppercase;
            padding-bottom: 8px;
            border-bottom: 1.5px solid #FF521B;
        }

        .degradation-levels-table {
            width: 100%;
            table-layout: fixed;
            border-collapse: separate;
            border-spacing: 10px 0; /* Restores the exact horizontal gaps between cards */
            margin: 15px 0;
        }

        .degradation-level-card-cell {
            width: 20%; /* Evenly spreads the 5 cards across 100% width */
            vertical-align: top;
            padding: 0;
        }

        .degradation-level-card-inner {
            background: #f7f7f5;
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            padding: 10px 6px 8px;
            text-align: center;
            height: 100%;
            display: block;
        }

        .degradation-level-card-cell.active .degradation-level-card-inner {
            background: #ffffff;
            border: 2px solid #EF9F27;
        }

        .degradation-bar-segment {
            display: block;
            height: 8px;
            border-radius: 4px;
            width: 100%;
            margin-top: 8px;
            position: relative;
        }

        .degradation-marker {
            display: inline-block;
            width: 0;
            height: 0;
            border-left: 6px solid transparent;
            border-right: 6px solid transparent;
            border-bottom: 8px solid #2c2c2a;
            position: absolute;
            top: 0;
            left: 50%;
            margin-left: -6px;
        }

        .degradation-level-label {
            display: block;
            font-size: 10px;
            font-weight: 600;
            color: #2c2c2a;
            line-height: 1.3;
            margin-bottom: 3px;
        }

        .degradation-level-subtitle {
            display: block;
            font-size: 9px;
            color: #888780;
            line-height: 1.3;
        }

        .degradation-footer {
            display: block;
            width: 100%;
            margin-top: 14px;
        }

        .degradation-level-info {
            display: block;
            float: left;
            width: 50%;
            text-align: left;
        }

        .degradation-score {
            display: block;
            float: right;
            width: 50%;
            text-align: right;
        }

        .degradation-footer-label {
            display: block;
            font-size: 9px;
            font-weight: 500;
            letter-spacing: 0.06em;
            color: #6b6b6b;
            margin: 0;
            text-transform: uppercase;
        }

        .degradation-footer-value {
            display: block;
            font-size: 13px;
            font-weight: 500;
            color: #FF521B;
            margin: 0;
        }

        .degradation-score .degradation-footer-value {
            font-size: 16px;
        }

        .degradation-disclaimer {
            display: block;
            font-size: 8px;
            color: #aaa;
            margin: 10px 0 0;
            line-height: 1.4;
            clear: both;
        }

        /* Unified professional style for all data tables */
        .data-table {
            width: 100%;
            border-collapse: collapse;
            margin: 12px 0;
            font-size: 0.9rem;
        }

        .data-table th,
        .data-table td {
            border: 0.5px solid #e8e8e8;
            padding: 8px 10px;
            text-align: left;
            line-height: 1.4;
        }

        .data-table th {
            background-color: #fafafa;
            font-weight: 600;
            color: #666;
            font-size: 0.85rem;
            letter-spacing: 0.02em;
        }
        
        .data-table tbody tr {
            background-color: #ffffff;
        }
        
        .data-table tbody tr:nth-child(even) {
            background-color: #fafafa;
        }
        
        .data-table td {
            color: #2b2b2a;
        }

        /* Modifier for label/value tables where the first column is the row header */
        .data-table-transposed td:first-child {
            font-weight: bold;
            width: 55%;
        }

        /* Waste ladder: ten value columns need tighter metrics than the default data table */
        .data-table.data-table-waste {
            table-layout: fixed;
        }

        .data-table.data-table-waste td {
            padding: 6px 2px;
            text-align: center;
            font-size: 0.75rem;
        }

        .data-table.data-table-waste td:first-child {
            width: 12%;
            padding-left: 8px;
            text-align: left;
            font-weight: bold;
        }

        .data-table.data-table-waste td.suggested {
            background-color: #e8f5e9;
            font-weight: bold;
        }

        /* Marker floating above the recommended column, deliberately without cell chrome */
        .data-table.data-table-waste th {
            border: none;
            background: none;
            padding: 0 2px 4px;
            font-size: 0.7rem;
            font-weight: 600;
            color: #FF521B;
            text-align: center;
        }

        /* LLM Formatting Layouts */
        .llm h2 {
            font-size: 1.5rem !important;
            color: #FF521B;
            text-align: center;
            font-weight: bold;
            margin-top: 20px;
            margin-bottom: 15px;
        }

        .llm h3 {
            color: #000000;
            font-size: 1.25rem !important;
            text-align: center;
            font-weight: bold;
            margin-top: 15px;
            margin-bottom: 10px;
        }

        .llm section ul {
            list-style-type: disc;
            padding-left: 20px;
            margin: 0 auto;
            max-width: 100%;
        }

        .llm section ul li {
            margin: 8px 0;
            line-height: 1.5;
            text-align: justify;
        }

        .emoji svg,
        .emoji img {
            width: 1em;
            height: 1em;
            display: inline-block;
        }

        /* A4 printable area (297mm) minus the @page top/bottom margins (18px each),
           used as an explicit reference box so the footer can be pinned to its bottom. */
        .cover-container {
            position: relative;
            width: 100%;
            height: 1000px;
        }

        .footer-info {
            position: absolute;
            left: 0;
            right: 0;
            bottom: 0;
            width: 100%;
            display: block;
        }

        .footer-info table {
            width: 100%;
            table-layout: fixed;
            border-collapse: collapse;
        }

        .footer-info td {
            padding-left: 0;
            text-align: left;
            vertical-align: middle;
        }

        .footer-info td:last-child {
            text-align: right;
        }

        .footer-logo {
            max-height: 120px;
            margin-top: 20px;
            display: inline-block;
        }

        /* 3D Structural Panels Layout Refactoring */
        .pan-col-headers {
            display: block;
            width: 100%;
            margin-bottom: 8px;
        }

        .pan-col-header {
            display: block;
            float: left;
            width: 48%;
            margin-right: 4%;
            text-align: center;
            font-size: 10px;
            color: #999;
            padding: 5px;
            background-color: #f7f7f7;
            border-radius: 4px;
        }

        .pan-col-header:last-child {
            margin-right: 0;
        }

        .pan-annotation-content {
            display: block;
            width: 100%;
        }

        .pan-annotation-labels {
            display: block;
            float: left;
            width: 30%;
            padding-right: 10px;
            word-wrap: break-word;
        }

        .pan-annotation-images {
            display: block;
            float: right;
            width: 68%;
        }

        .pan-images-row {
            display: block;
            width: 100%;
        }

        .pan-image-cell {
            display: block;
            float: left;
            width: 48%;
            margin-right: 4%;
            text-align: center;
        }

        .pan-image-cell:last-child {
            margin-right: 0;
        }

        .custom-page-title {
            font-size: 1.4rem;
            margin-bottom: 16px;
            font-weight: 600;
            color: #2b2b2a;
            text-align: left;
            padding-bottom: 10px;
            border-bottom: 2.5px solid #FF521B;
        }

        .custom-section {
            margin-bottom: 20px;
            page-break-inside: avoid;
            display: block;
            width: 100%;
        }

        .split-section {
            width: 100%;
            display: block;
        }

        .split-column {
            display: block;
        }

        .split-2 > .split-first { float: left; width: 49%; }
        .split-2 > .split-last { float: right; width: 49%; }
        .split-3 > .split-first { float: left; width: 32%; }
        .split-3 > .split-middle { float: left; width: 32%; margin-left: 2%; }
        .split-3 > .split-last { float: right; width: 32%; }

        .custom-section-text {
            line-height: 1.6;
            text-align: justify;
        }

        .custom-section-image-container {
            text-align: center;
            margin: 10px 0;
        }

        .custom-section-image {
            max-width: 100%;
            height: auto;
        }

        .custom-section-caption {
            font-size: 0.9rem;
            color: #666;
            margin-top: 5px;
            font-style: italic;
        }

        /* Priority styles for Text */
        .text-priority-IMPORTANT { font-size: 1.2rem; font-weight: bold; }
        .text-priority-MEDIUM { font-size: 1rem; }
        .text-priority-SMALL { font-size: 0.85rem; color: #444; }

        /* Priority styles for Image */
        .image-priority-IMPORTANT { width: 100%; }
        .image-priority-MEDIUM { width: 70%; }
        .image-priority-SMALL { width: 40%; }

    </style>
</body>
</html>
